<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer"><title>OIDC Auth Demo</title><link rel="stylesheet" href="./styles.css"></head>
<body><main class="shell">
<section class="hero panel"><p class="eyebrow">OpenID Connect sample</p><h1>Sign in with a passkey</h1>
<p>Sign in or create a passkey on the identity provider’s page.</p><p>Issuer: <code id="issuer"></code></p>
<div class="actions"><button id="signin">Sign in / Create account</button><button id="userinfo">Load UserInfo</button><button id="signout">Sign out</button></div></section>
<section class="panel"><h2>Session</h2><pre id="session">Signed out</pre></section>
<section class="panel"><h2>UserInfo</h2><pre id="profile"></pre></section>
<section class="panel"><p id="status" role="status">Ready</p></section>
</main><script type="module" src="./app.js"></script></body></html>
