AWSTemplateFormatVersion: '2010-09-09'
Description: Shared storage for OIDC authorization transactions and grants
Parameters:
  TableName:
    Type: String
    Default: OIDCGrants
Resources:
  Grants:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref TableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
Outputs:
  GrantsTableName:
    Value: !Ref Grants
  GrantsTableArn:
    Value: !GetAtt Grants.Arn
